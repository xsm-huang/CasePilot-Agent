[project]
name = "casepilot-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "langgraph>=1,<2", "langgraph-checkpoint-postgres>=3,<4", "langchain-core>=1,<2",
  "psycopg[binary,pool]>=3.2,<4", "httpx>=0.28,<1", "python-dotenv>=1,<2",
  "python-multipart>=0.0.20", "pypdf>=5,<7", "langchain-community>=0.4,<1",
  "langchain-text-splitters>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casepilot"]
